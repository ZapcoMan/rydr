# Service port
server:
  port: 8012

# Application name and configuration
spring:
  application:
    name: service-passenger-user
  datasource: # Database connection configuration
    # MySQL driver class
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Database connection URL
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME_THREE:rydr-three}?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    # Database username
    username: ${DB_USER:root}
    # Database password
    password: ${DB_PASSWORD:REQUIRED_CHANGEME}
    # HikariCP connection pool configuration (Boot default pool)
    hikari:
      # Minimum idle connections
      minimum-idle: 5
      # Maximum pool size
      maximum-pool-size: 20
      # Maximum wait time for a connection (ms)
      connection-timeout: 20000
      # Maximum lifetime of a connection (ms)
      max-lifetime: 1800000
      # Validate database connection
      connection-test-query: SELECT 1


# MyBatis configuration
mybatis:
#  # MyBatis config file path
#  config-location: classpath:mybatis/mybatis.cfg.xml
#  # Package alias for entity classes
#  type-aliases-package: com.rydr.common
  # Mapper XML file locations
  mapper-locations:
    - classpath:mybatis/mapper/*.xml

# Service registry
eureka:
  client:
    # Set service registry URL
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:REQUIRED_CHANGEME}@${EUREKA_HOST:eureka-7900}:7900/eureka/
  instance:
    # Heartbeat interval in seconds
    lease-renewal-interval-in-seconds: 1
    # Service expiration time - instance removed if no heartbeat received within this period
    lease-expiration-duration-in-seconds: 1
    hostname: localhost
    prefer-ip-address: true
    # Eureka registry info URL
    status-page-url: /actuator/info
    # Health check URL
    health-check-url-path: /actuator/health
    instance-id: service-passenger-user
    metadata-map:
      user.name: ${EUREKA_USER:admin}
      user.password: ${EUREKA_PASSWORD:REQUIRED_CHANGEME}

# Admin monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ALWAYS
