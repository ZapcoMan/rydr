# ============================================================
# cloud-admin (dev) — centralized config from rydr-config-server
# ============================================================
spring:
  security:
    user:
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD:REQUIRED_CHANGEME}
  mail:
    host: ${MAIL_SMTP_HOST:smtp.example.com}
    username: ${MAIL_USERNAME:user@example.com}
    password: ${MAIL_PASSWORD:REQUIRED_CHANGEME}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:REQUIRED_CHANGEME}@${EUREKA_HOST:eureka-7900}:7900/eureka/
