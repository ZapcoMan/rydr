# ============================================================
# service-order-dispatch (dev) — centralized config from rydr-config-server
# ============================================================
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:REQUIRED_CHANGEME}@${EUREKA_HOST:eureka-7900}:7900/eureka/
  instance:
    metadata-map:
      user.name: ${EUREKA_USER:admin}
      user.password: ${EUREKA_PASSWORD:REQUIRED_CHANGEME}
