# Service port
server:
  port: 6001

# Application name and authentication
spring:
  application:
    name: config-server

  # Activate the native (local filesystem) config backend so the whole project can
  # run without an external git repository. The native backend loads every module's
  # {application}-{profile}.yml from the classpath:/config-repo/ directory.
  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo/
        # Optional git backend: switch to it by setting CONFIG_PROFILE=git and providing
        # CONFIG_GIT_URI to a reachable private repository, then set search-locations
        # to {application}-{profile}.yml in that repo. Native is the default for local use.
#        git:
#          uri: ${CONFIG_GIT_URI:https://github.com/oi/rydr-config-profile}
#          username: ${CONFIG_GIT_USERNAME:}
#          password: ${CONFIG_GIT_PASSWORD:}
#          timeout: 15
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
# Service registry
eureka:
  client:
    # Set service registry URL
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:REQUIRED_CHANGEME}@${EUREKA_HOST:eureka-7900}:7900/eureka/
  instance:
    hostname: localhost
    instance-id: config-server

management:
  endpoints:
    web:
      exposure:
        # In YAML use double quotes; in properties files quotes are not needed
        include: health,info,prometheus
  # Distributed tracing: Brave -> Zipkin
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411}/api/v2/spans
    discovery-client-enabled: false
logging:
  level:
    org.springframework.cloud: debug
    org.springframework.boot: debug
