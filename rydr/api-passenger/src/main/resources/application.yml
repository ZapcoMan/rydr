# Service port
server:
  port: 9011

# Application name and authentication
spring:
  application:
    name: api-passenger
  data:
    redis:
      database: 0
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  cloud:
    # Enable OpenFeign circuit breaker (fallback support, replaces feign.hystrix.enabled)
    openfeign:
      circuitbreaker:
        enabled: true
    # LoadBalancer (replaces ribbon)
    loadbalancer:
      eager-load:
        clients:
        - SERVICE-SMS

eureka:
  client:
    # Set service registry URL
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:REQUIRED_CHANGEME}@${EUREKA_HOST:eureka-7900}:7900/eureka/
    enabled: true
  instance:
    hostname: localhost
    instance-id: api-passenger
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 1
    lease-expiration-duration-in-seconds: 1

feign:
  compression:
    request:
      mime-types:
      - text/xml
      min-request-size: 2048
  client:
    config:
      service-valuation:
#        request-interceptors:
#        - com.rydr.passenger.feign.interceptor.MyBasicAuthRequestInterceptor
        connect-timeout: 5000
        read-timeout: 5000
        logger-level: basic

# Ribbon configuration removed: Netflix Ribbon was replaced by Spring Cloud LoadBalancer
# Use spring.cloud.loadbalancer.* instead




# Admin monitoring (observability)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Default is never
      show-details: ALWAYS
      enabled: true
  # Distributed tracing: Brave -> Zipkin
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411}/api/v2/spans
    discovery-client-enabled: false

logging:
  level:
    org.springframework: DEBUG
    com.rydr.passenger.feign.ServiceForecast: debug
