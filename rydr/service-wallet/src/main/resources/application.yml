# Service port (8006 is already taken by service-order-dispatch)
server:
  port: 8007

# Application name and configuration
spring:
  application:
    name: service-wallet
  # Wallet / payment persistence (same database as order & valuation: rydr)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rydr}?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:REQUIRED_CHANGEME}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 20000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    timeout: 2000
    password: ${REDIS_PASSWORD:}

# MyBatis
mybatis:
  mapper-locations:
    - classpath:mybatis/mapper/*.xml
  type-aliases-package: com.rydr.wallet.entity
  configuration:
    map-underscore-to-camel-case: true

# Service registry
eureka:
#  server:
#    enable-self-preservation: false       # Disable self-preservation
#    eviction-interval-timer-in-ms: 2000   # Eviction interval in milliseconds
  client:
    # Set service registry URL
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:REQUIRED_CHANGEME}@${EUREKA_HOST:eureka-7900}:7900/eureka/
  instance:
    # Heartbeat interval in seconds
    lease-renewal-interval-in-seconds: 1
    # Service expiration time - instance removed if no heartbeat received within this period
    lease-expiration-duration-in-seconds: 1
    hostname: localhost
    prefer-ip-address: true
    # Eureka registry info URL
    status-page-url: /actuator/info
    # Health check URL
    health-check-url-path: /actuator/health
    instance-id: service-wallet
    metadata-map:
      user.name: ${EUREKA_USER:admin}
      user.password: ${EUREKA_PASSWORD:REQUIRED_CHANGEME}

# Admin monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ALWAYS
