# Application name and authentication
spring:
  application:
    name: service-valuation
  security:
    user:
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD:REQUIRED_CHANGEME}
  profiles:
    active:
    - 8060
  # Database connection configuration (HikariCP, Boot default pool)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rydr}?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:REQUIRED_CHANGEME}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 20000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  # Redis: used by the price/rule caches
  data:
    redis:
      database: 0
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      password: ${REDIS_PASSWORD:}

# MyBatis configuration
mybatis:
  mapper-locations:
    - classpath:mybatis/mapper/*.xml
  type-aliases-package: com.rydr.entity
  configuration:
    # tbl_order_rule_price.order_id -> OrderRulePrice.orderId
    map-underscore-to-camel-case: true

# Service registry
eureka:
  client:
    # Set service registry URL
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:REQUIRED_CHANGEME}@${EUREKA_HOST:eureka-7900}:7900/eureka/


# Admin monitoring (observability)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: ALWAYS
  # Distributed tracing: Brave -> Zipkin
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411}/api/v2/spans
    discovery-client-enabled: false
---
spring:
  config:
    activate:
      on-profile: 8060
server:
  port: 8060
---
spring:
  config:
    activate:
      on-profile: 8061
server:
  port: 8061
