# Single node configuration
# Application name and authentication
spring:
  application:
    name: eureka
  security:
    user:
      name: ${EUREKA_USER:admin}
      password: ${EUREKA_PASSWORD:REQUIRED_CHANGEME}
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    # Disable self-preservation
    enable-self-preservation: false
    # Cleanup interval time
    eviction-interval-timer-in-ms: 5000

# Admin monitoring (observability)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: ALWAYS
  # Distributed tracing: Brave -> Zipkin
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411}/api/v2/spans
    discovery-client-enabled: false

logging:
  level:
    root: info
---
spring:
  config:
    activate:
      on-profile: 7900
server:
  port: 7900
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:REQUIRED_CHANGEME}@localhost:7900/eureka/
