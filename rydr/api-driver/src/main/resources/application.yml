# Application name and authentication
spring:
  application:
    name: api-driver
  data:
    redis:
      database: 0
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  # Distributed tracing: Sleuth/Zipkin removed in Spring Cloud 2025.x
  cloud:
    # LoadBalancer eager loading (replaces ribbon.eager-load)
    loadbalancer:
      eager-load:
        clients:
        - SERVICE-SMS
        - SERVICE-VERIFICATION-CODE
# Service registry
eureka:
  client:
    # Set service registry URL
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:REQUIRED_CHANGEME}@${EUREKA_HOST:eureka-7900}:7900/eureka/
    enabled: true
  instance:
    hostname: localhost
    instance-id: api-driver
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 1
    lease-expiration-duration-in-seconds: 1

# Ribbon configuration removed: Netflix Ribbon was replaced by Spring Cloud LoadBalancer
# Use spring.cloud.loadbalancer.* instead

# Admin monitoring (observability)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Default is never
      show-details: ALWAYS
      enabled: true
  # Distributed tracing: Brave -> Zipkin
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411}/api/v2/spans
    discovery-client-enabled: false

logging:
  level:
    root: info
    org.springframework: info

---
spring:
  config:
    activate:
      on-profile: 9002
# Service port
server:
  port: 9002
---
spring:
  config:
    activate:
      on-profile: 9003
# Service port
server:
  port: 9003
