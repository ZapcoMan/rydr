# Service port
#server:
#  port: 8004

# Application name and configuration
spring:
  application:
    name: service-order
  data:
    redis:
      database: 0
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      password: ${REDIS_PASSWORD:}
    # Database connection configuration
  datasource:
    # MySQL driver class
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Database connection URL
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rydr}?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    # Database username
    username: ${DB_USER:root}
    # Database password
    password: ${DB_PASSWORD:REQUIRED_CHANGEME}
    # HikariCP connection pool configuration (Boot default pool)
    hikari:
      # Minimum idle connections
      minimum-idle: 5
      # Maximum pool size
      maximum-pool-size: 20
      # Maximum wait time for a connection (ms)
      connection-timeout: 20000
      # Maximum lifetime of a connection (ms)
      max-lifetime: 1800000
      # Validate database connection
      connection-test-query: SELECT 1
  # ActiveMQ broker (reliable-message outbox for payment settlement)
  activemq:
    broker-url: tcp://${ACTIVEMQ_HOST:127.0.0.1}:${ACTIVEMQ_PORT:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:REQUIRED_CHANGEME}
    pool:
      enabled: true
      max-connections: 50
# Custom Redis Sentinel configuration
sentinel:
  address:
    - ${SENTINEL_HOST_1:127.0.0.1}:${SENTINEL_PORT_1:26379}
    - ${SENTINEL_HOST_2:127.0.0.1}:${SENTINEL_PORT_2:26479}
    - ${SENTINEL_HOST_3:127.0.0.1}:${SENTINEL_PORT_3:26579}
  masterName: ${SENTINEL_MASTER:mymaster}

# Service registry
eureka:

  client:
    enabled: true
    # Set service registry URL
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:REQUIRED_CHANGEME}@${EUREKA_HOST:eureka-7900}:7900/eureka/
  instance:
    hostname: localhost

# MyBatis configuration
mybatis:
  # MyBatis config file path
  config-location: classpath:mybatis/mybatis.cfg.xml
  # Package alias for entity classes
  type-aliases-package: com.rydr.common
  # Mapper XML file locations
  mapper-locations:
  - classpath:mybatis/mapper/*.xml

# Admin monitoring (observability)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: ALWAYS
  # Distributed tracing: Brave -> Zipkin
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411}/api/v2/spans
    discovery-client-enabled: false

---
spring:
  config:
    activate:
      on-profile: 8004
# Service port
server:
  port: 8004
