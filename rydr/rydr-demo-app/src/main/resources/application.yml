server:
  port: 8083
spring:
  application:
    name: rydr-demo-app
  # spring.thymeleaf removed: the thymeleaf starter is no longer a dependency of this module

# Admin monitoring (observability)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: ALWAYS
  # Distributed tracing: Brave -> Zipkin
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411}/api/v2/spans
    discovery-client-enabled: false
